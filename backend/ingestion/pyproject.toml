[project]
name = "fairprocess-ingestion"
version = "2.0.0"
description = "FairProcess 2.0 Public Data Ingestion"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.11",
    "playwright>=1.52",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "feedparser>=6.0",
    "pydantic>=2.11",
    "structlog>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "respx>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
