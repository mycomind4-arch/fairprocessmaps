[project]
name = "fairprocess-workers"
version = "2.0.0"
description = "FairProcess 2.0 Temporal Workers"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "geoalchemy2>=0.17",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "neo4j>=5.28",
    "minio>=7.2",
    "meilisearch>=0.34",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.3",
    "openai>=1.75",
    "structlog>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
    "mypy>=1.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
