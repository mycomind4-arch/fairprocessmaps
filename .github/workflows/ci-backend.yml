name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "database/**"
      - "shared/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "database/**"
      - "shared/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, workers, ai, ingestion]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
      - name: Lint ${{ matrix.service }}
        working-directory: backend/${{ matrix.service }}
        run: |
          uv sync --extra dev
          uv run ruff check src
          uv run ruff format --check src
          uv run mypy src

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: fairprocess_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      neo4j:
        image: neo4j:2026.06-community
        env:
          NEO4J_AUTH: neo4j/test
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
      - name: Run API tests
        working-directory: backend/api
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/fairprocess_test
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
        run: |
          uv sync --extra dev
          uv run pytest tests/ -v --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: backend/api/coverage.xml
