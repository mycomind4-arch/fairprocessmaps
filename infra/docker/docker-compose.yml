version: "3.9"

services:
  # ───────────────────────────────────────────────
  # Layer 3 — Spatial Database
  # ───────────────────────────────────────────────
  postgis:
    image: postgis/postgis:16-3.7
    container_name: fp_postgis
    environment:
      POSTGRES_DB: fairprocess
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fp_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../database/postgis/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d fairprocess"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # Layer 3 — pgvector extension
  # ───────────────────────────────────────────────
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: fp_pgvector
    environment:
      POSTGRES_DB: fairprocess_vectors
      POSTGRES_USER: fp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fp_dev}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fp -d fairprocess_vectors"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # Layer 6 — Knowledge Graph
  # ───────────────────────────────────────────────
  neo4j:
    image: neo4j:2026.06-community
    container_name: fp_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-fp_dev}
      NEO4J_PLUGINS: '["apoc", "gds"]'
      NEO4J_dbms_memory_heap_max__size: 2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ../database/neo4j/migrations:/init-scripts
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "fp_dev", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ───────────────────────────────────────────────
  # Layer 7 — Search
  # ───────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.14
    container_name: fp_meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-fp_dev_key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # Layer 9 — Workflow Engine
  # ───────────────────────────────────────────────
  temporal:
    image: temporalio/auto-setup:1.27
    container_name: fp_temporal
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: fp
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-fp_dev}
      POSTGRES_SEEDS: postgis
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
      - "8233:8233"
    depends_on:
      postgis:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:2.37
    container_name: fp_temporal_ui
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # ───────────────────────────────────────────────
  # Layer 10 — Evidence Storage
  # ───────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2026-07-14T16-36-46Z
    container_name: fp_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fp
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-fp_dev_secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ───────────────────────────────────────────────
  # Layer 4/5/8 — AI & Ingestion Workers
  # ───────────────────────────────────────────────
  worker:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.worker
    container_name: fp_worker
    environment:
      DATABASE_URL: postgresql+asyncpg://fp:${POSTGRES_PASSWORD:-fp_dev}@postgis:5432/fairprocess
      VECTOR_DATABASE_URL: postgresql+asyncpg://fp:${POSTGRES_PASSWORD:-fp_dev}@pgvector:5432/fairprocess_vectors
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fp_dev}
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: fp
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-fp_dev_secret}
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-fp_dev_key}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ../../backend:/app
      - worker_cache:/app/.cache
    depends_on:
      postgis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      temporal:
        condition: service_started
      minio:
        condition: service_healthy
      meilisearch:
        condition: service_started

  # ───────────────────────────────────────────────
  # Layer 8 — API Gateway
  # ───────────────────────────────────────────────
  api:
    build:
      context: ../../backend
      dockerfile: ../infra/docker/Dockerfile.api
    container_name: fp_api
    environment:
      DATABASE_URL: postgresql+asyncpg://fp:${POSTGRES_PASSWORD:-fp_dev}@postgis:5432/fairprocess
      VECTOR_DATABASE_URL: postgresql+asyncpg://fp:${POSTGRES_PASSWORD:-fp_dev}@pgvector:5432/fairprocess_vectors
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fp_dev}
      TEMPORAL_HOST: temporal:7233
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: fp
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-fp_dev_secret}
      MEILI_HOST: http://meilisearch:7700
      MEILI_API_KEY: ${MEILI_MASTER_KEY:-fp_dev_key}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET:-fp_dev_jwt}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ../../backend:/app
    depends_on:
      postgis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      temporal:
        condition: service_started

  # ───────────────────────────────────────────────
  # Layer 1/11 — Frontend
  # ───────────────────────────────────────────────
  web:
    build:
      context: ../../frontend/web
      dockerfile: ../../infra/docker/Dockerfile.web
    container_name: fp_web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MAPLIBRE_STYLE: https://demotiles.maplibre.org/style.json
    ports:
      - "3000:3000"
    volumes:
      - ../../frontend/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgis_data:
  pgvector_data:
  neo4j_data:
  neo4j_logs:
  meilisearch_data:
  minio_data:
  worker_cache:
